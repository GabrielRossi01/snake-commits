name: Generate Snake Game

on:
  # Executa todos os dias à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite executar manualmente
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Gera a cobrinha com base nos seus commits
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: GabrielRossi01
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.svg?palette=github-dark

      # Publica os arquivos gerados na branch "output"
      - name: push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
